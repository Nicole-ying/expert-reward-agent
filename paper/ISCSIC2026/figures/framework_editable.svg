<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1688" height="909" viewBox="0 0 1688 909">
  <defs>
    <style>
      .h1{font:700 27px Arial,sans-serif;fill:#171b86}
      .h2{font:700 23px Arial,sans-serif;fill:#171b86}
      .h3{font:700 20px Arial,sans-serif;fill:#151b2f}
      .body{font:19px Arial,sans-serif;fill:#141414}
      .small{font:17px Arial,sans-serif;fill:#141414}
      .edge{font:19px Arial,sans-serif;fill:#141414}
      .navy{stroke:#171b86}
      .teal{stroke:#087e98}
      .orange{stroke:#dd5b00}
      .black{stroke:#111}
      .panel{fill:#fff;stroke-width:2.4}
      .subpanel{fill:#fff;stroke:#202c9c;stroke-width:1.8}
    </style>
    <linearGradient id="softBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#111"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dd5b00"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#087e98"/>
    </marker>
  </defs>
  <rect width="1688" height="909" fill="#fff"/>

  <!-- Connectors are isolated for easy editing -->
  <g id="connectors" inkscape:groupmode="layer" inkscape:label="Connectors"
     fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M365 260 H518" class="black" stroke-width="2.7" marker-end="url(#arrowBlack)"/>
    <text x="389" y="244" class="edge" fill="#141414" stroke="none">Reward Rₜ</text>

    <path d="M195 310 V395 Q195 404 204 404 H520" class="black" stroke-width="2.5"/>

    <path d="M1148 130 H1480 Q1490 130 1490 140 V355" class="black" stroke-width="2.5" marker-end="url(#arrowBlack)"/>
    <path d="M1148 262 H1328 Q1340 262 1340 274 V346" class="black" stroke-width="2.5" marker-end="url(#arrowBlack)"/>
    <text x="1188" y="246" class="edge" fill="#141414" stroke="none">Training traces</text>
    <path d="M1148 310 H1306 Q1320 310 1320 324 V346" class="black" stroke-width="2.5" marker-end="url(#arrowBlack)"/>
    <text x="1172" y="335" class="edge" fill="#141414" stroke="none">Native outcomes</text>

    <path d="M520 716 H350" class="black" stroke-width="2.6" marker-end="url(#arrowBlack)"/>
    <text x="373" y="703" class="edge" fill="#141414" stroke="none">Bounded repair</text>

    <path d="M1460 760 V900 H188 V894" class="black" stroke-width="2.6" marker-end="url(#arrowBlack)"/>

    <path d="M1460 760 V850 H322" class="orange" stroke-width="2.6" stroke-dasharray="3 6" marker-end="url(#arrowOrange)"/>
    <text x="770" y="875" class="edge" fill="#141414" stroke="none">Improved outcome</text>
  </g>

  <!-- 1. Task Interface -->
  <g id="module-1-task-interface" inkscape:groupmode="layer" inkscape:label="1 Task Interface">
    <rect x="18" y="12" width="347" height="330" rx="12" class="panel black"/>
    <line x1="18" y1="107" x2="365" y2="107" class="black" stroke-width="1.8" stroke-dasharray="8 5"/>
    <circle cx="65" cy="61" r="25" fill="none" stroke="#1748c7" stroke-width="4"/>
    <circle cx="65" cy="61" r="13" fill="none" stroke="#1748c7" stroke-width="4"/>
    <path d="M65 61 L89 37 M89 37 l-3 14 l14 -3" fill="none" stroke="#1748c7" stroke-width="4"/>
    <text x="112" y="54" class="h2">1. Task Interface &amp;</text>
    <text x="112" y="83" class="h2">Reward Initialization</text>

    <path d="M56 143 h42 l16 16 v48 H56 Z M98 143 v16 h16" fill="none" stroke="#111" stroke-width="2.5"/>
    <line x1="69" y1="170" x2="102" y2="170" stroke="#111" stroke-width="2"/>
    <line x1="69" y1="183" x2="102" y2="183" stroke="#111" stroke-width="2"/>
    <text x="123" y="174" class="body">Task specification</text>
    <line x1="196" y1="202" x2="196" y2="239" stroke="#111" stroke-width="2.6" marker-end="url(#arrowBlack)"/>

    <line x1="55" y1="248" x2="101" y2="248" stroke="#111" stroke-width="2.6"/>
    <circle cx="76" cy="248" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
    <line x1="55" y1="264" x2="101" y2="264" stroke="#111" stroke-width="2.6"/>
    <circle cx="88" cy="264" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
    <line x1="55" y1="280" x2="101" y2="280" stroke="#111" stroke-width="2.6"/>
    <circle cx="70" cy="280" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="123" y="274" class="body">Initialization</text>
  </g>

  <!-- 2. CREATE Diagnostic Agent -->
  <g id="module-2-create-agent" inkscape:groupmode="layer" inkscape:label="2 CREATE Agent">
    <rect x="520" y="78" width="628" height="738" rx="13" fill="#fbfbff" stroke="#171b86" stroke-width="2.8"/>
    <text x="834" y="119" text-anchor="middle" class="h1">2. CREATE Diagnostic Agent</text>

    <!-- Observe -->
    <rect x="540" y="142" width="588" height="202" rx="9" class="subpanel"/>
    <path d="M540 152 Q540 142 550 142 H1118 Q1128 142 1128 152 V191 H540 Z" fill="url(#softBlue)" stroke="#202c9c" stroke-width="1.8"/>
    <text x="834" y="177" text-anchor="middle" class="h2">Observe</text>
    <text x="618" y="224" text-anchor="middle" class="body">Training traces</text>
    <polyline points="597,284 612,245 630,276 648,253 665,279 681,262" fill="none" stroke="#4471e2" stroke-width="3"/>

    <text x="812" y="224" text-anchor="middle" class="body">Native outcomes</text>
    <line x1="781" y1="286" x2="781" y2="245" stroke="#4471e2" stroke-width="3"/>
    <line x1="781" y1="286" x2="866" y2="286" stroke="#4471e2" stroke-width="3"/>
    <rect x="795" y="269" width="8" height="17" fill="#4471e2"/>
    <rect x="813" y="252" width="8" height="34" fill="#4471e2"/>
    <rect x="831" y="259" width="8" height="27" fill="#4471e2"/>
    <rect x="849" y="246" width="8" height="40" fill="#4471e2"/>

    <text x="1017" y="224" text-anchor="middle" class="body">Lineage context</text>
    <text x="1017" y="247" text-anchor="middle" class="small">(active lineage)</text>
    <polyline points="978,282 998,268 1018,278 1038,261 1059,276 1080,263" fill="none" stroke="#4058da" stroke-width="2.5"/>
    <circle cx="978" cy="282" r="4" fill="#fff" stroke="#4058da" stroke-width="2"/>
    <circle cx="998" cy="268" r="4" fill="#fff" stroke="#4058da" stroke-width="2"/>
    <circle cx="1018" cy="278" r="4" fill="#fff" stroke="#4058da" stroke-width="2"/>
    <circle cx="1038" cy="261" r="4" fill="#fff" stroke="#4058da" stroke-width="2"/>
    <circle cx="1059" cy="276" r="4" fill="#fff" stroke="#4058da" stroke-width="2"/>
    <circle cx="1080" cy="263" r="4" fill="#fff" stroke="#4058da" stroke-width="2"/>
    <path d="M630 295 V307 H1044 V295" fill="none" stroke="#111" stroke-width="2.2"/>
    <line x1="834" y1="307" x2="834" y2="344" stroke="#111" stroke-width="2.4" marker-end="url(#arrowBlack)"/>

    <!-- Diagnose and Act -->
    <rect x="540" y="360" width="588" height="286" rx="9" class="subpanel"/>
    <path d="M540 370 Q540 360 550 360 H1118 Q1128 360 1128 370 V403 H540 Z" fill="url(#softBlue)" stroke="#202c9c" stroke-width="1.8"/>
    <text x="834" y="392" text-anchor="middle" class="h2">Diagnose &amp; Act</text>
    <circle cx="708" cy="442" r="20" fill="#fff" stroke="#171b86" stroke-width="3"/>
    <line x1="708" y1="412" x2="708" y2="425" stroke="#171b86" stroke-width="3"/>
    <line x1="708" y1="459" x2="708" y2="473" stroke="#171b86" stroke-width="3"/>
    <line x1="678" y1="442" x2="691" y2="442" stroke="#171b86" stroke-width="3"/>
    <line x1="725" y1="442" x2="738" y2="442" stroke="#171b86" stroke-width="3"/>
    <circle cx="708" cy="442" r="5" fill="#171b86"/>
    <text x="754" y="450" class="body">Target (code, test, reward)</text>
    <line x1="708" y1="466" x2="708" y2="490" stroke="#111" stroke-width="2.4" marker-end="url(#arrowBlack)"/>

    <rect x="562" y="490" width="538" height="101" rx="9" fill="#fff" stroke="#777" stroke-width="1.6" stroke-dasharray="8 6"/>
    <rect x="574" y="501" width="161" height="76" rx="8" fill="#f6fdff" stroke="#087e98" stroke-width="2"/>
    <text x="654" y="529" text-anchor="middle" class="h3" style="fill:#087e98">L1 Tune</text>
    <line x1="632" y1="544" x2="676" y2="544" stroke="#087e98" stroke-width="2.5"/>
    <circle cx="645" cy="544" r="4" fill="#fff" stroke="#087e98" stroke-width="2"/>
    <line x1="632" y1="556" x2="676" y2="556" stroke="#087e98" stroke-width="2.5"/>
    <circle cx="662" cy="556" r="4" fill="#fff" stroke="#087e98" stroke-width="2"/>
    <line x1="632" y1="568" x2="676" y2="568" stroke="#087e98" stroke-width="2.5"/>
    <circle cx="650" cy="568" r="4" fill="#fff" stroke="#087e98" stroke-width="2"/>

    <rect x="748" y="501" width="162" height="76" rx="8" fill="#faf8ff" stroke="#5949cc" stroke-width="2"/>
    <text x="829" y="529" text-anchor="middle" class="h3" style="fill:#3421b7">L2 Refactor</text>
    <text x="829" y="566" text-anchor="middle" style="font:700 27px Consolas,monospace;fill:#3421b7">&lt;/&gt;</text>

    <rect x="924" y="501" width="162" height="76" rx="8" fill="#fff8f2" stroke="#dd5b00" stroke-width="2"/>
    <text x="1005" y="529" text-anchor="middle" class="h3" style="fill:#dd5b00">L3 Redesign</text>
    <path d="M988 554 l16 -9 l16 9 l-16 9 z M988 554 v18 l16 9 v-18 M1020 554 v18 l-16 9" fill="none" stroke="#dd5b00" stroke-width="2"/>

    <path d="M574 586 V598 H910 V586" fill="none" stroke="#111" stroke-width="2.1"/>
    <text x="742" y="627" text-anchor="middle" class="small">single target</text>
    <line x1="834" y1="646" x2="834" y2="663" stroke="#111" stroke-width="2.4" marker-end="url(#arrowBlack)"/>

    <!-- Persistent memory -->
    <rect x="540" y="664" width="588" height="136" rx="9" class="subpanel"/>
    <path d="M540 674 Q540 664 550 664 H1118 Q1128 664 1128 674 V709 H540 Z" fill="url(#softBlue)" stroke="#202c9c" stroke-width="1.8"/>
    <text x="834" y="697" text-anchor="middle" class="h2">Persistent Memory</text>
    <rect x="558" y="724" width="92" height="61" rx="7" fill="#fbfdff" stroke="#087e98" stroke-width="1.6"/>
    <text x="604" y="760" text-anchor="middle" class="small">t-2 record</text>
    <line x1="650" y1="755" x2="678" y2="755" stroke="#111" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <rect x="681" y="724" width="92" height="61" rx="7" fill="#fbfdff" stroke="#087e98" stroke-width="1.6"/>
    <text x="727" y="760" text-anchor="middle" class="small">t-1 record</text>
    <line x1="773" y1="755" x2="801" y2="755" stroke="#111" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <rect x="804" y="724" width="92" height="61" rx="7" fill="#fbfdff" stroke="#087e98" stroke-width="1.6"/>
    <text x="850" y="750" text-anchor="middle" class="small">t record</text>
    <text x="850" y="771" text-anchor="middle" class="small">(current)</text>
    <line x1="896" y1="755" x2="924" y2="755" stroke="#111" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <rect x="927" y="724" width="72" height="61" rx="7" fill="#fbfdff" stroke="#087e98" stroke-width="1.6"/>
    <text x="963" y="763" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#141414">···</text>
    <line x1="999" y1="755" x2="1027" y2="755" stroke="#111" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <rect x="1030" y="724" width="82" height="61" rx="7" fill="#fbfdff" stroke="#087e98" stroke-width="1.6"/>
    <text x="1071" y="750" text-anchor="middle" class="small">t+k record</text>
    <text x="1071" y="771" text-anchor="middle" class="small">(latest)</text>
  </g>

  <!-- 3. Policy Training & Native Evaluation -->
  <g id="module-3-policy-evaluation" inkscape:groupmode="layer" inkscape:label="3 Policy Training and Evaluation">
    <rect x="1300" y="354" width="353" height="407" rx="13" fill="#fbfeff" stroke="#087e98" stroke-width="2.8"/>
    <line x1="1300" y1="444" x2="1653" y2="444" stroke="#087e98" stroke-width="1.8" stroke-dasharray="8 5"/>
    <line x1="1300" y1="642" x2="1653" y2="642" stroke="#087e98" stroke-width="1.8" stroke-dasharray="8 5"/>
    <circle cx="1344" cy="397" r="23" fill="none" stroke="#087e98" stroke-width="3.5"/>
    <path d="M1331 404 l12 -12 l10 7 l14 -18" fill="none" stroke="#087e98" stroke-width="3"/>
    <rect x="1373" y="385" width="8" height="24" fill="#087e98"/><rect x="1387" y="373" width="8" height="36" fill="#087e98"/><rect x="1401" y="391" width="8" height="18" fill="#087e98"/>
    <text x="1430" y="390" class="h2" style="fill:#087e98">3. Policy Training &amp;</text>
    <text x="1430" y="420" class="h2" style="fill:#087e98">Native Evaluation</text>

    <path d="M1368 510 C1318 528 1318 590 1368 605" fill="none" stroke="#087e98" stroke-width="2.8" marker-end="url(#arrowTeal)"/>
    <path d="M1368 604 C1318 588 1318 527 1368 510" fill="none" stroke="#087e98" stroke-width="2.8" marker-end="url(#arrowTeal)"/>
    <rect x="1388" y="486" width="44" height="44" fill="#fff" stroke="#087e98" stroke-width="1.8"/>
    <polyline points="1396,520 1405,497 1414,517 1424,505" fill="none" stroke="#4471e2" stroke-width="2.3"/>
    <text x="1450" y="517" class="body">Training</text>
    <rect x="1388" y="558" width="44" height="44" fill="#fff" stroke="#087e98" stroke-width="1.8"/>
    <line x1="1396" y1="593" x2="1396" y2="566" stroke="#4471e2" stroke-width="2"/>
    <line x1="1396" y1="593" x2="1425" y2="593" stroke="#4471e2" stroke-width="2"/>
    <rect x="1402" y="583" width="5" height="10" fill="#4471e2"/><rect x="1410" y="572" width="5" height="21" fill="#4471e2"/><rect x="1418" y="578" width="5" height="15" fill="#4471e2"/>
    <text x="1450" y="590" class="body">Native evaluation</text>

    <line x1="1476" y1="653" x2="1476" y2="682" stroke="#111" stroke-width="2.5" marker-end="url(#arrowBlack)"/>
    <text x="1476" y="708" text-anchor="middle" class="body">Reward Rₜ₊₁</text>
    <text x="1476" y="735" text-anchor="middle" class="small">(Next iteration)</text>
  </g>

  <!-- 4. Reward Transition & Best Archive -->
  <g id="module-4-transition-archive" inkscape:groupmode="layer" inkscape:label="4 Reward Transition and Archive">
    <rect x="18" y="574" width="330" height="320" rx="13" fill="#fffdf9" stroke="#dd5b00" stroke-width="2.8"/>
    <line x1="18" y1="657" x2="348" y2="657" stroke="#dd5b00" stroke-width="1.8" stroke-dasharray="8 5"/>
    <path d="M62 598 l10 20 l22 3 l-16 15 l4 22 l-20 -10 l-20 10 l4 -22 l-16 -15 l22 -3 z" fill="none" stroke="#dd5b00" stroke-width="3"/>
    <text x="108" y="613" class="h2" style="fill:#dd5b00">4. Reward Transition &amp;</text>
    <text x="108" y="642" class="h2" style="fill:#dd5b00">Best Archive</text>

    <path d="M54 688 h28 l10 10 l-10 10 h-28 l-10 -10 z" fill="none" stroke="#dd5b00" stroke-width="2.3"/>
    <line x1="68" y1="675" x2="68" y2="721" stroke="#dd5b00" stroke-width="2"/>
    <text x="121" y="705" class="body">Bounded repair</text>
    <line x1="189" y1="718" x2="189" y2="749" stroke="#111" stroke-width="2.5" marker-end="url(#arrowBlack)"/>
    <rect x="40" y="765" width="280" height="83" rx="9" fill="#fff" stroke="#dd5b00" stroke-width="1.8" stroke-dasharray="8 6"/>
    <path d="M62 786 h29 v10 c0 14 -29 14 -29 0 z M68 807 h17 M76 807 v12 M65 819 h23" fill="none" stroke="#dd5b00" stroke-width="2.3"/>
    <text x="121" y="813" class="body">Best reward archive</text>
  </g>
</svg>
