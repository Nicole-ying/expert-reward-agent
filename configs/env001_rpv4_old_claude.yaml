extends: env001_paper_v4.yaml

# ── rpv4_old_claude: paper_v4 prompts + behavior analyst + Claude Sonnet 5 ──
subagent_investigator:
  enabled: false

llm:
  provider: proxy
  base_url: https://proaiapi.tech/v1
  # NOTE: real key redacted before commit — set your own proxy key here before running
  api_key: sk-YOUR_PROXY_API_KEY

  # ── All roles use claude-sonnet-5 ──
  model_env: claude-sonnet-5
  model_reward: claude-sonnet-5
  model_reflection: claude-sonnet-5
  model_investigator: claude-sonnet-5

  # ── Token budgets (Claude supports large outputs) ──
  temperature_environment_analyzer: 0.0
  temperature_reward_generator: 0.0
  max_tokens_env: 8192
  max_tokens_reward: 16384

  # ── Prompt paths (same as main experiment) ──
  environment_analyzer: prompts/paper_v4/01_environment_analyzer_prompt.md
  reward_generator: prompts/paper_v4/02_reward_generator_prompt.md

ablation:
  reflection_prompt_path: prompts/paper_v4/reflection_agent_prompt.md

iteration:
  experiment_prefix: rpv4_old_claude
  total_rounds: 10
